version: "3.9"

services:
  n8n:
    build: .
    container_name: n8n
    ports:
      - "5678:5678"
    env_file:
      - .env
    environment:
      - N8N_ENCRYPTION_KEY=${N8N_ENCRYPTION_KEY}
      - DB_TYPE=postgresdb
      - DB_POSTGRESDB_HOST=postgres
      - DB_POSTGRESDB_PORT=5432
      - DB_POSTGRESDB_DATABASE=${POSTGRES_DB}
      - DB_POSTGRESDB_USER=${POSTGRES_USER}
      - DB_POSTGRESDB_PASSWORD=${POSTGRES_PASSWORD}
      - N8N_CUSTOM_EXTENSIONS=/home/node/.n8n/custom
      - NODE_FUNCTION_ALLOW_EXTERNAL=${ALLOWED_MODULES}
      - EXECUTIONS_PROCESS=${EXECUTIONS_PROCESS:-main}
      - EXECUTIONS_MODE=${EXECUTIONS_MODE:-regular}
      - QUEUE_BULL_REDIS_HOST=redis
      - QUEUE_BULL_REDIS_PORT=6379
      - N8N_LOG_LEVEL=info
      - GENERIC_TIMEZONE=America/New_York
      - N8N_PERSONALIZATION_ENABLED=false
    volumes:
      - ./custom:/home/node/.n8n/custom
      - ./workflows:/home/node/.n8n/workflows
      - n8n_data:/home/node/.n8n
    depends_on:
      - postgres
      - rabbitmq
      - proxy
      - redis
    restart: unless-stopped
    networks:
      - n8n-network

  postgres:
    image: postgres:15-alpine
    container_name: n8n_postgres
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
    volumes:
      - ./data/postgres:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    restart: unless-stopped
    networks:
      - n8n-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  rabbitmq:
    image: rabbitmq:3-management
    container_name: n8n_rabbitmq
    environment:
      - RABBITMQ_DEFAULT_USER=${RABBITMQ_USER}
      - RABBITMQ_DEFAULT_PASS=${RABBITMQ_PASS}
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - ./data/rabbitmq:/var/lib/rabbitmq
    restart: unless-stopped
    networks:
      - n8n-network
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  proxy:
    image: veriteknik/pluggedin-mcp-proxy:latest
    container_name: n8n_mcp_proxy
    environment:
      - MCP_PROXY_KEY=${MCP_PROXY_KEY}
      - LOG_LEVEL=info
      - POSTGRES_URL=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
    volumes:
      - ./mcp-data:/data
      - ./scripts:/scripts:ro
    ports:
      - "7990:7990"
    depends_on:
      - postgres
      - rabbitmq
    restart: unless-stopped
    networks:
      - n8n-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:7990/healthz"]
      interval: 30s
      timeout: 10s
      retries: 3

  redis:
    image: redis:7-alpine
    container_name: n8n_redis
    ports:
      - "6379:6379"
    volumes:
      - ./data/redis:/data
    networks:
      - n8n-network
    restart: unless-stopped
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  vector:
    image: timberio/vector:0.34.0-alpine
    container_name: n8n_vector
    volumes:
      - ./vector.toml:/etc/vector/vector.toml:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    environment:
      - POSTGRES_HOST=postgres
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
    networks:
      - n8n-network
    restart: unless-stopped
    depends_on:
      - postgres
    user: root

volumes:
  n8n_data:
  mcp_data:

networks:
  n8n-network:
    driver: bridge